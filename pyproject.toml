[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-secretaire"
version = "0.1.0"
description = "Archivage et impression de communications clients, localement sur Mac"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "reportlab>=4,<5", "pypdf>=4,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
auto-secretaire = "autosecretaire.__main__:main"

[tool.setuptools.packages.find]
include = ["autosecretaire*"]

[tool.setuptools.package-data]
autosecretaire = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
